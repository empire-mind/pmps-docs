[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pmps-document-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
pmps-control = "pmps_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
