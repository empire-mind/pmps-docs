schema_version: "1.0"
status_definitions:
  FOUND: "Artifact located; approval and issue state not implied."
  PLANNED: "Named in the existing Master Document Register."
  CANDIDATE: "Useful legacy content requires assessment and consolidation."
  GAP: "No suitable controlled candidate evidenced."
  CONDITIONAL: "Activate only when the associated activity or risk applies."

build_waves:
  - id: W0
    name: "Control foundation"
    exit_criteria:
      - "Document Control SOP ratified"
      - "Master Document Register verified"
      - "File plan ratified"
      - "Approval receipt template issued"
      - "Migration manifest template issued"
  - id: W1
    name: "Low-risk lifecycle pilot"
    pilot_document: "Client Onboarding Checklist"
    exit_criteria:
      - "Hash recorded"
      - "Candidates compared"
      - "Owner approval bound to exact version and hash"
      - "Drive readback verified"
      - "Audit replay complete"
  - id: W2
    name: "WHS control family"
    candidate_ids:
      - PMPS_WHS_06
      - PMPS_WHS_07
      - PMPS_WHS_08
      - PMPS_WHS_09
      - PMPS_WHS_12
      - PMPS_WHS_13
      - PMPS_WHS_35
      - PMPS-PRO-21
      - PMPS-FRM-22
      - PMPS-FRM-023
      - HS-MF-13
    approval_requirement: "Ashley operational review plus competent WHS/legal review"
  - id: W3
    name: "Mobilisation and workforce"
    restricted: true
    sequence:
      - "Blank standard worker templates"
      - "Recruitment and vetting"
      - "Employee onboarding"
      - "Subcontractor onboarding"
      - "Site mobilisation"
      - "Qualifications and competency"
      - "Current worker evidence"
      - "Offboarded worker records"
  - id: W4
    name: "Revenue and finance"
    sequence:
      - "Rate-card authority"
      - "Timesheet and docket verification"
      - "Payroll and billing separation"
      - "Client invoicing evidence pack"
      - "Supplier and subcontractor invoice verification"
      - "Quote, rate and margin approval"
      - "Contract review and obligations register"

